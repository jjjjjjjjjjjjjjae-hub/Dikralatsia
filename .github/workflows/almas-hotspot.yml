name: ALMAS Hotspot APK
on:
  push:
    paths:
      - 'ALMAS-HOTSPOT/**'
      - '.github/workflows/almas-hotspot.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALMAS-HOTSPOT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS-Hotspot-debug
          path: ALMAS-HOTSPOT/app/build/outputs/apk/debug/app-debug.apk
